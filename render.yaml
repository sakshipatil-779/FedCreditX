services:
  # FedCreditX FastAPI Backend Service
  - type: web
    name: fedcreditx-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000

  # FedCreditX Next.js Frontend Service
  - type: web
    name: fedcreditx
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npx next start -H 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NEXT_PUBLIC_API_URL
        value: https://fedcreditx-api.onrender.com
